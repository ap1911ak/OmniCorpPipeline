version: '3.8'

services:
  # บริการสำหรับ Python, Jupyter Notebook, Prefect, Pytest
  app:
    build: .
    container_name: python_dev_app
    ports:
      - "8888:8888"   # Jupyter Lab
      - "4200:4200"   # Prefect Dashboard (กรณีสั่งเปิด prefect server)
    volumes:
      - .:/app        # Mount โค้ดในเครื่องเข้า Container ให้แก้แล้วอัปเดตทันที
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/mydb
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    depends_on:
      - db

  # บริการฐานข้อมูล PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: